[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"          # World Chain (OP Stack) supports Cancun opcodes
fs_permissions = [{ access = "read", path = "./"}]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

# World Chain endpoints (RPC is public; no key needed for dev/spikes)
[rpc_endpoints]
worldchain_sepolia = "${WORLDCHAIN_SEPOLIA_RPC}"
worldchain_mainnet = "${WORLDCHAIN_MAINNET_RPC}"

[etherscan]
worldchain_sepolia = { key = "${WORLDSCAN_API_KEY}", url = "https://worldchain-sepolia.explorer.alchemy.com/api" }
worldchain_mainnet = { key = "${WORLDSCAN_API_KEY}", url = "https://worldscan.org/api" }
